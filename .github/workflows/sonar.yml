name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - master
      - preparetest_sprint2
  pull_request:
    types: [opened, synchronize, reopened]

env:
  PROJECT_KEY: Tracking-Logistico_Sprint-2   # <-- cambia aquí si usas un proyecto nuevo para Sprint-3
  MIN_COVERAGE: 65          # % cobertura mínima
  MAX_DEBT_MIN: 960         # 2 días = 2 x 8 h x 60 min
  MAX_COMPLEXITY: 50        # complejidad global (solo informativa)
  MAX_CLASS_COMPLEXITY: 20  # límite por clase (ajústalo a lo que pida tu docente)

jobs:
  build-and-analyze:
    name: Build and Analyze (monorepo)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test y análisis Sonar (todos los módulos)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.organization=tracklog20262
          -Dsonar.projectKey=$PROJECT_KEY
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.qualitygate.wait=false

      - name: Quality gates en el Summary (informativo, no bloquea)
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          API=https://sonarcloud.io/api

          # PR -> pullRequest ; push -> branch
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE="pullRequest=$PR_NUMBER"
          else
            SCOPE="branch=$BRANCH"
          fi

          # ---- Estado general del Quality Gate ----
          RESP_G=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/qualitygates/project_status?projectKey=$PROJECT_KEY&$SCOPE")
          if ! echo "$RESP_G" | jq -e '.projectStatus' >/dev/null 2>&1; then
            echo "::warning::No se pudo leer el Quality Gate: $RESP_G"
            exit 0
          fi
          GATE=$(echo "$RESP_G" | jq -r '.projectStatus.status')

          # ---- Métricas generales ----
          RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/measures/component?component=$PROJECT_KEY&$SCOPE&metricKeys=coverage,sqale_index,complexity")
          M=$(echo "$RESP" | jq -r '.component.measures[]? | "\(.metric)=\(.value)"')
          get() { echo "$M" | grep "^$1=" | cut -d= -f2; }

          COV=$(get coverage)
          DEBT=$(get sqale_index)
          CX=$(get complexity)

          RESP_V=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&types=VULNERABILITY&severities=CRITICAL,BLOCKER&resolved=false&ps=1")
          VULN=$(echo "$RESP_V" | jq -r '.total // "N/A"')
          severity_count() {
            curl -s -u "$SONAR_TOKEN:" \
              "$API/issues/search?componentKeys=$PROJECT_KEY&$SCOPE&types=VULNERABILITY&severities=$1&resolved=false&ps=1" |
              jq -r '.total // "N/A"'
          }
          BLOCKER=$(severity_count BLOCKER)
          CRITICAL=$(severity_count CRITICAL)
          MAJOR=$(severity_count MAJOR)
          MINOR=$(severity_count MINOR)
          INFO=$(severity_count INFO)

          ok()  { echo "✅"; }
          bad() { echo "❌"; }
          na()  { echo "➖"; }

          if [ -n "$COV" ]; then
            COV_S=$(awk "BEGIN{exit !($COV >= $MIN_COVERAGE)}" && ok || bad)
          else COV_S=$(na); fi
          if [ -n "$DEBT" ]; then
            DEBT_S=$([ "$DEBT" -lt "$MAX_DEBT_MIN" ] && ok || bad)
          else DEBT_S=$(na); fi
          # La complejidad global es solo informativa (el criterio real es por clase)
          CX_S=$(na)
          if [ "$VULN" = "N/A" ]; then VULN_S=$(na)
          else VULN_S=$([ "$VULN" = "0" ] && ok || bad); fi

          if [ "$GATE" = "OK" ]; then GATE_S="✅ PASSED"; else GATE_S="❌ $GATE"; fi

          {
            echo "## Resultado SonarQube Cloud"
            echo ""
            echo "**Quality Gate:** $GATE_S"
            echo ""
            echo "### Condiciones del Quality Gate"
            echo "| Métrica | Valor | Umbral | Estado |"
            echo "|---|---|---|---|"
            echo "$RESP_G" | jq -r '.projectStatus.conditions[]? |
              "| \(.metricKey) | \(.actualValue // "N/A") | \(.errorThreshold // "-") | \(if .status=="OK" then "✅" else "❌" end) |"'
            echo ""
            echo "### Criterios del proyecto"
            echo "| Criterio | Valor | Meta | Estado |"
            echo "|---|---|---|---|"
            echo "| Cobertura | ${COV:-N/A}% | ≥ ${MIN_COVERAGE}% | $COV_S |"
            echo "| Deuda técnica | ${DEBT:-N/A} min | < ${MAX_DEBT_MIN} min | $DEBT_S |"
            echo "| Complejidad ciclomática (total, informativa) | ${CX:-N/A} | ver tabla por clase | $CX_S |"
            echo "| Vulnerabilidades críticas/bloqueantes | $VULN | 0 | $VULN_S |"
            echo ""
            echo "### Vulnerabilidades por severidad"
            echo "| Severidad | Cantidad |"
            echo "|---|---:|"
            echo "| BLOCKER | $BLOCKER |"
            echo "| CRITICAL | $CRITICAL |"
            echo "| MAJOR | $MAJOR |"
            echo "| MINOR | $MINOR |"
            echo "| INFO | $INFO |"
            echo ""
            echo "[Ver en SonarCloud](https://sonarcloud.io/project/overview?id=$PROJECT_KEY)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$GATE" != "OK" ] || echo "$COV_S$DEBT_S$VULN_S" | grep -q "❌"; then
            echo "::warning title=Quality gates::Algunos criterios no se cumplen. Revisa la tabla en Summary."
          fi

          exit 0

      - name: Complejidad por clase (informativo)
        if: always()
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.ref_name }}
        run: |
          API=https://sonarcloud.io/api
          if [ "$EVENT_NAME" = "pull_request" ]; then
            SCOPE="pullRequest=$PR_NUMBER"
          else
            SCOPE="branch=$BRANCH"
          fi

          RESP=$(curl -s -u "$SONAR_TOKEN:" \
            "$API/measures/component_tree?component=$PROJECT_KEY&$SCOPE&metricKeys=complexity&qualifiers=FIL&metricSort=complexity&s=metric&asc=false&metricSortFilter=withMeasuresOnly&ps=500")

          if ! echo "$RESP" | jq -e '.components' >/dev/null 2>&1; then
            echo "::warning::No se pudo leer la complejidad por clase: $RESP"
            exit 0
          fi

          {
            echo "### Complejidad ciclomática por clase (límite: < $MAX_CLASS_COMPLEXITY)"
            echo "| Clase | Complejidad | Estado |"
            echo "|---|---:|---|"
            echo "$RESP" | jq -r --argjson max "$MAX_CLASS_COMPLEXITY" '
              .components[]?
              | (.measures[]? | select(.metric=="complexity") | .value | tonumber) as $cx
              | "| \(.path) | \($cx) | \(if $cx < $max then "✅" else "❌" end) |"'
          } >> "$GITHUB_STEP_SUMMARY"

          if echo "$RESP" | jq -e --argjson max "$MAX_CLASS_COMPLEXITY" \
            '[.components[]? | .measures[]? | select(.metric=="complexity") | .value | tonumber | select(. >= $max)] | length > 0' >/dev/null; then
            echo "::warning title=Complejidad::Hay clases que superan el límite de $MAX_CLASS_COMPLEXITY."
            # Para que el pipeline FALLE cuando una clase supere el límite:
            # 1) quita "continue-on-error: true" de este paso
            # 2) descomenta la siguiente línea
            # exit 1
          fi